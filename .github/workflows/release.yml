name: Build & Publish APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'نام نسخه برای ریلیز (مثلاً v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: دریافت سورس کد (Checkout Code)
        uses: actions/checkout@v4

      - name: تنظیم نسخه جاوا ۱۷ (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تنظیم ابزار گرادل (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: دسترسی اجرایی به gradlew (Make gradlew executable)
        run: chmod +x ./gradlew

      - name: ایجاد فایل keystore پیش‌فرض دیباگ
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: ساخت فایل APK (Assemble Debug APK)
        run: ./gradlew assembleDebug

      - name: آماده‌سازی و تغییر نام فایل APK
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/SimpleCalculator-${TAG}.apk"

      - name: انتشار در بخش Releases گیت‌هاب (Create GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "نسخه ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            ## 📱 انتشار نسخه جدید اپلیکیشن ماشین حساب ساده
            
            فایل APK پیوست شده زیر را دانلود کرده و مستقیماً روی گوشی اندرویدی خود نصب کنید.
            
            ### تغییرات:
            - رابط کاربری مدرن با دکمه‌های گرد زیبا
            - تشخیص خودکار تم سیستم (حالت تیره و روشن)
            - کاملاً آفلاین و بدون نیاز به اینترنت
            - ذخیره تاریخچه محاسبات با دیتابیس Room
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
